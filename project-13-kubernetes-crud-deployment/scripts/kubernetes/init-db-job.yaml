apiVersion: batch/v1
kind: Job
metadata:
  name: init-db
  namespace: carservice
spec:
  template:
    spec:
      containers:
      - name: init-db
        image: mcr.microsoft.com/mssql/server:2019-latest
        command: ["/bin/bash", "-c"]
        args:
        - |
          /opt/mssql-tools/bin/sqlcmd -S mssql -U SA -P 'Qwerty123!' -Q "CREATE DATABASE CarServiceWorkshopDb;"
      restartPolicy: Never
  backoffLimit: 0
